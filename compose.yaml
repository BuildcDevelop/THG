services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      THG_DATA_DIR: "/data"
      GAME_TICK_SCHEDULE: "*/5 * * * * *"
      CORS_ORIGIN: "https://thelastdominion.netlify.app"
    ports:
      - "3001:3001"
    networks:
      default:
        aliases:
          - thg-api
    volumes:
      - ./server/data:/data
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
