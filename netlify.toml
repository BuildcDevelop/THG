[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to the live self-hosted backend (Docker).
# Keep this in sync with the backend domain/TLS (Caddy).
[[redirects]]
  from = "/api"
  to = "https://thg.89-167-89-109.sslip.io/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://thg.89-167-89-109.sslip.io/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
